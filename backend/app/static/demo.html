<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Epistemy — Content Ingestion</title>
<style>
  :root {
    --bg:#0b0f17; --bg2:#0e1320; --card:#151b27; --card2:#1a2230;
    --ink:#e8eef6; --muted:#8a98ad; --line:#222c3a;
    --accent:#6366f1; --accent2:#8b5cf6; --ok:#22c55e; --warn:#f59e0b; --err:#f43f5e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 -apple-system,Segoe UI,Roboto,Inter,sans-serif;
         color:var(--ink);
         background:radial-gradient(1200px 600px at 80% -10%, #1b2236 0%, transparent 60%),
                    radial-gradient(900px 500px at -10% 0%, #1a1633 0%, transparent 55%),
                    var(--bg); min-height:100vh; }
  .wrap { max-width:880px; margin:0 auto; padding:36px 20px 80px; }
  .hero { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .logo { width:42px; height:42px; border-radius:11px; flex:none;
          background:linear-gradient(135deg,var(--accent),var(--accent2));
          display:grid; place-items:center; font-size:22px;
          box-shadow:0 8px 24px rgba(99,102,241,.35); }
  h1 { font-size:23px; margin:0; letter-spacing:-.2px; }
  .sub { color:var(--muted); margin:2px 0 26px; }
  .card { background:linear-gradient(180deg,var(--card),var(--bg2));
          border:1px solid var(--line); border-radius:16px; padding:22px;
          margin-bottom:18px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:.6px;
             color:var(--muted); margin:0 0 14px; font-weight:600; }
  label { display:block; font-size:12.5px; color:var(--muted); margin:0 0 6px; }
  input[type=text], input:not([type]), select {
    width:100%; background:#0c111b; color:var(--ink); border:1px solid #283346;
    border-radius:10px; padding:11px 12px; font:inherit; transition:border .15s; }
  input:focus, select:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:14px; }
  .row > div { flex:1; }
  /* dropzone */
  .drop { margin-top:16px; border:1.5px dashed #34415a; border-radius:14px;
          padding:26px; text-align:center; cursor:pointer; transition:.18s;
          background:#0c111b; }
  .drop:hover, .drop.over { border-color:var(--accent);
          background:rgba(99,102,241,.08); }
  .drop .big { font-size:30px; }
  .drop .t { font-weight:600; margin-top:6px; }
  .drop .h { color:var(--muted); font-size:12.5px; margin-top:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { background:#0c111b; border:1px solid #2b3650; border-radius:999px;
          padding:5px 12px; font-size:12.5px; display:flex; gap:7px; align-items:center; }
  .btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
         border:0; border-radius:10px; padding:12px 20px; font:inherit; font-weight:600;
         cursor:pointer; margin-top:16px; box-shadow:0 8px 20px rgba(99,102,241,.3);
         transition:transform .08s, opacity .15s; }
  .btn:hover { transform:translateY(-1px); }
  .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .btn.ghost { background:#121826; border:1px solid #2b3650; box-shadow:none;
               color:var(--ink); padding:8px 14px; margin:0; }
  .hdrow { display:flex; justify-content:space-between; align-items:center;
           margin:0 0 14px; }
  .hdrow h2 { margin:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:#3a4960; flex:none;
         display:inline-block; }
  .dot.run { background:var(--warn); animation:pulse 1s infinite; }
  .dot.ok { background:var(--ok); box-shadow:0 0 8px rgba(34,197,94,.6); }
  .dot.err { background:var(--err); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .badge { font-size:11.5px; padding:3px 10px; border-radius:999px; background:#0c111b;
           border:1px solid #2b3650; color:var(--muted); white-space:nowrap; }
  .badge.ready { color:var(--ok); border-color:rgba(34,197,94,.5); background:rgba(34,197,94,.08); }
  .badge.failed { color:var(--err); border-color:rgba(244,63,94,.5); background:rgba(244,63,94,.08); }
  .uprow { display:flex; align-items:center; gap:12px; padding:11px 0;
           border-bottom:1px solid var(--line); }
  .uprow:last-child { border-bottom:0; }
  .uprow .ic { font-size:18px; }
  .uprow .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .uprow .sz { color:var(--muted); font-size:12px; }
  .bar { height:4px; border-radius:3px; background:#1d2638; overflow:hidden;
         margin-top:5px; }
  .bar > i { display:block; height:100%; width:0;
             background:linear-gradient(90deg,var(--accent),var(--accent2));
             transition:width .4s; }
  pre { background:#0c111b; border:1px solid var(--line); border-radius:10px;
        padding:12px; overflow:auto; font-size:12.5px; color:#9fb3c8; }
  /* tree */
  .org { margin-top:6px; }
  .node { display:flex; align-items:center; gap:9px; padding:6px 0; }
  .org > .node { font-weight:600; font-size:15px; }
  .course { margin:2px 0 4px 16px; padding-left:14px; border-left:1px solid var(--line); }
  .mat { margin-left:30px; display:flex; align-items:center; gap:9px; padding:8px 0;
         border-bottom:1px solid #18202e; }
  .mat .name { flex:1; cursor:pointer; }
  .mat .name:hover { color:#a5b4fc; }
  .vers { margin:2px 0 8px 46px; }
  .ver { display:flex; align-items:center; gap:9px; padding:4px 0; font-size:13px;
         color:var(--muted); }
  .empty { color:var(--muted); font-style:italic; padding:8px 0; }
  .caret { color:var(--muted); font-size:11px; width:12px; transition:transform .15s; }
  .caret.open { transform:rotate(90deg); }
  /* toast */
  #toasts { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column;
            gap:10px; z-index:50; }
  .toast { background:#151c2b; border:1px solid var(--line); border-left:4px solid var(--ok);
           border-radius:10px; padding:12px 16px; min-width:240px; color:var(--ink);
           box-shadow:0 12px 30px rgba(0,0,0,.4); animation:slide .25s ease; }
  .toast.err { border-left-color:var(--err); }
  .toast .tt { font-weight:600; font-size:13.5px; }
  .toast .td { color:var(--muted); font-size:12.5px; margin-top:2px; }
  @keyframes slide { from{opacity:0; transform:translateX(20px)} to{opacity:1} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo">📘</div>
    <div>
      <h1>Epistemy — Content Ingestion</h1>
      <p class="sub" style="margin:0">Upload course material → S3 → ingest worker → embedded chunks. Live on AWS.</p>
    </div>
  </div>

  <div class="card">
    <h2>Upload</h2>
    <div class="row">
      <div><label>Organization</label><input id="org" value="berkeley" /></div>
      <div><label>Course</label><input id="course" value="data101" /></div>
      <div><label>Role</label>
        <select id="role"><option>professor</option><option>student</option></select>
      </div>
    </div>

    <div class="drop" id="drop">
      <div class="big">📤</div>
      <div class="t">Drag &amp; drop files here, or click to browse</div>
      <div class="h">.md · .markdown · .txt · .pptx · .docx · .pdf</div>
      <input id="files" type="file" multiple style="display:none" />
    </div>
    <div class="chips" id="chips"></div>
    <button class="btn" id="go">Upload &amp; Ingest</button>
  </div>

  <div class="card" id="uploadsCard" style="display:none">
    <h2>Uploads</h2>
    <div id="uploads"></div>
  </div>

  <div class="card">
    <div class="hdrow">
      <h2>Course library</h2>
      <button class="btn ghost" id="refresh">↻ Refresh</button>
    </div>
    <div class="tree" id="tree"></div>
  </div>
</div>
<div id="toasts"></div>
<script src="/static/demo.js"></script>
</body>
</html>

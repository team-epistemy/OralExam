name: unit-tests

# Runs the contentIngestion unit-test suite on every submission (push + PR).
on:
  push:
    paths:
      - "contentIngestion/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "contentIngestion/**"
      - ".github/workflows/tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contentIngestion
    env:
      # Dummy values so Settings() resolves without real cloud credentials.
      EPISTEMY_ACCOUNT: "000000000000"
      EPISTEMY_BUCKET: "ci-dummy-bucket"
      AWS_REGION: "us-west-2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: contentIngestion/requirements.txt

      - name: Install test dependencies
        # requirements.txt is the lean test set; numpy + networkx are the only
        # extra imports the unit tests pull in (all heavier deps are lazy).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy networkx

      - name: Run unit tests
        run: pytest
